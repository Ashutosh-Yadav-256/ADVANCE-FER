version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: advance_fer_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: advance_fer_ui
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
    depends_on:
      - api
    restart: unless-stopped

  angular-frontend:
    image: node:22-alpine
    container_name: advance_fer_angular
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--port", "4200"]
    ports:
      - "4200:4200"
    depends_on:
      - api
    restart: unless-stopped

